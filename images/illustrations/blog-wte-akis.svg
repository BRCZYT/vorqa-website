<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atıktan enerjiye dönüşüm proses akış diyagramı">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EEF4"/></linearGradient>
<pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3A6A94" stroke-opacity=".06"/></pattern>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.ln{stroke:#3A6A94;stroke-width:2;fill:none;stroke-opacity:.9}
.lnT{stroke:#3A6A94;stroke-width:1;fill:none;stroke-opacity:.4}
.arw{stroke:#3A6A94;stroke-width:2;fill:none;marker-end:url(#ah)}
.lbl{font-family:'JetBrains Mono','JetBrains Mono Variable',monospace;font-size:15px;letter-spacing:.1em;fill:#3A6A94}
.lblO{fill:#E87722}.lblM{fill:#0A2540;fill-opacity:.855}
</style>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#3A6A94"/></marker>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect width="1600" height="1200" fill="url(#g2)"/>

<!-- process boxes: bunker -> combustion -> boiler -> turbine -> grid -->
<g class="ln">
<rect x="180" y="500" width="200" height="160"/>
<rect x="460" y="460" width="200" height="240"/>
<rect x="740" y="440" width="220" height="280"/>
<rect x="1040" y="500" width="200" height="160"/>
<rect x="1320" y="540" width="140" height="80"/>
</g>
<g fill="#E87722" filter="url(#gl)" opacity=".85">
<path d="M540 700 l14 24 h-28 z"/><path d="M600 700 l14 24 h-28 z"/>
</g>
<g class="arw">
<path d="M380 580 h80"/><path d="M660 580 h80"/><path d="M960 580 h80"/><path d="M1240 580 h80"/>
</g>

<g class="lbl lblM" text-anchor="middle">
<text x="280" y="600">ATIK BUNKER&#304;</text>
<text x="560" y="560">YANMA</text><text x="560" y="580">(GRATE)</text>
<text x="850" y="560">KAZAN</text><text x="850" y="580">BUHAR &#220;RET&#304;M&#304;</text>
<text x="1140" y="590">T&#220;RB&#304;N</text>
<text x="1390" y="590" font-size="13">&#350;EBEKE</text>
</g>

<!-- energy output metric -->
<text x="850" y="820" text-anchor="middle" class="lbl lblO" font-size="20">500&#8211;650 kWh / ton at&#305;k</text>

<!-- flue gas treatment note -->
<path class="lnT" d="M850 440 v-60 h200"/>
<text x="1070" y="372" class="lbl" font-size="13">BACA GAZI ARITMA</text>

<!-- title block -->
<g class="lbl">
<text x="120" y="150" class="lblO">//</text><text x="152" y="150" class="lblM" font-size="19">ATIKTAN ENERJ&#304;YE (WtE) PROSES AKI&#350;I</text>
<text x="120" y="182">MOV&#304;NG GRATE TEKNOLOJ&#304;S&#304;</text>
</g>
</svg>
