<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beton santrali kapasite hesaplama formülü — teknik diyagram">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EEF4"/></linearGradient>
<pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3A6A94" stroke-opacity=".06"/></pattern>
<style>
.ln{stroke:#3A6A94;stroke-width:2;fill:none;stroke-opacity:.9}
.lnT{stroke:#3A6A94;stroke-width:1;fill:none;stroke-opacity:.4}
.dim{stroke:#3A6A94;stroke-width:1;stroke-opacity:.5;fill:none}
.lbl{font-family:'JetBrains Mono','JetBrains Mono Variable',monospace;font-size:17px;letter-spacing:.16em;fill:#3A6A94}
.lblO{fill:#E87722}.lblM{fill:#0A2540;fill-opacity:.855}
.fml{font-family:'JetBrains Mono','JetBrains Mono Variable',monospace;fill:#0A2540}
</style>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect width="1600" height="1200" fill="url(#g2)"/>

<!-- Formula box -->
<rect x="260" y="330" width="1080" height="220" fill="#FFFFFF" class="ln" stroke-width="2.5" opacity=".9"/>
<text x="800" y="410" text-anchor="middle" font-size="64" class="fml">Q = P / (T &#215; &#951; &#215; f)</text>
<text x="800" y="470" text-anchor="middle" font-size="20" class="fml" fill-opacity=".55">m&#179;/sa kapasite &#8226; &#951; = mixer verimliliği &#8226; f = &#231;evre fakt&#246;r&#252;</text>

<!-- Bar chart: capacity across shift hours -->
<g class="ln" stroke-width="2">
<path d="M340 900 v-360 M340 900 h920"/>
</g>
<g class="lnT"><path d="M340 780 h920 M340 660 h920 M340 540 h920"/></g>
<g fill="#E87722" opacity=".85">
<rect x="400" y="760" width="80" height="140"/>
<rect x="540" y="680" width="80" height="220"/>
<rect x="680" y="600" width="80" height="300"/>
<rect x="820" y="540" width="80" height="360"/>
<rect x="960" y="620" width="80" height="280"/>
<rect x="1100" y="700" width="80" height="200"/>
</g>
<g class="lbl" font-size="15">
<text x="440" y="925" text-anchor="middle">6</text><text x="580" y="925" text-anchor="middle">7</text>
<text x="720" y="925" text-anchor="middle">8</text><text x="860" y="925" text-anchor="middle">9</text>
<text x="1000" y="925" text-anchor="middle">10</text><text x="1140" y="925" text-anchor="middle">11</text>
</g>
<text x="800" y="965" text-anchor="middle" class="lbl">VARDİYA S&#220;RES&#304; (SAAT)</text>

<!-- dimension callout -->
<path class="dim" d="M900 540 l60 -40 h80"/><circle cx="900" cy="540" r="4" fill="#3A6A94"/>
<text x="1050" y="494" class="lbl lblO">Q maks.</text>

<!-- title block -->
<g class="lbl">
<text x="120" y="150" class="lblO">//</text><text x="152" y="150" class="lblM" font-size="19">BETON SANTRAL&#304; KAPAS&#304;TE HESABI</text>
<text x="120" y="182">ACI 304R-00 REFERANSLI METODOLOJ&#304;</text>
</g>
</svg>
