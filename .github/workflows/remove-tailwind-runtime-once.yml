name: Remove Tailwind Runtime Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove unused Tailwind runtime
        run: node scripts/remove-tailwind-runtime.cjs
      - name: Verify removal
        run: '! grep -R "cdn.tailwindcss.com" index.html en/index.html tr/index.html ar/index.html en/academy/index.html tr/akademi/index.html ar/academy/index.html en/contact/index.html tr/iletisim/index.html ar/contact/index.html'
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html tr/index.html ar/index.html en/academy/index.html tr/akademi/index.html ar/academy/index.html en/contact/index.html tr/iletisim/index.html ar/contact/index.html
          git commit -m "perf: remove unused Tailwind runtime CDN"
          git push
