name: Academy SEO Static Build

on:
  push:
    branches:
      - seo-academy-hubs-v2
    paths:
      - scripts/academy-seo-static.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-academy-hubs-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static Academy indexes
        run: node scripts/academy-seo-static.cjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/academy/index.html tr/akademi/index.html ar/academy/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "seo: generate static Academy knowledge entry pages"
            git push origin HEAD:seo-academy-hubs-v2
          fi
