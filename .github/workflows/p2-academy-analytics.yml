name: P2 Academy Analytics Patch

on:
  push:
    branches:
      - seo-academy-hubs-v2
    paths:
      - scripts/p2-academy-analytics.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-academy-hubs-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply analytics patch
        run: node scripts/p2-academy-analytics.cjs
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/academy-hub.js api/academy-map.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "seo: add GA4 measurement to Academy hubs and map"
            git push origin HEAD:seo-academy-hubs-v2
          fi
