name: Tailwind Runtime Audit
on:
  push:
    branches: [seo-tailwind-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run audit
        run: node scripts/tailwind-runtime-audit.cjs
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P3_TAILWIND_RUNTIME_AUDIT.md
          git diff --cached --quiet || git commit -m "audit: report Tailwind runtime usage"
          git push
