<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body{background:#030d18;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.pl-logo-row{opacity:0;transform:translateY(10px);transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}

.pl-logo-row img{display:block;height:110px;width:auto}
</style>
</head>
<body>
<div class="pl-logo-row in" id="pl-logo">
  <img src="http://localhost:3000/brand_assets/vorqa_logo_white_cropped.png" alt="VORQA">
</div>
</body></html>
